[package]
name = "cairn-app"
description = "The Cairn window, built with GTK4 and libadwaita"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "cairn-gui"
path = "src/main.rs"

[dependencies]
cairn-core.workspace = true
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
